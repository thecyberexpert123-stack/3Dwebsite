# Whimlet Engine — one command on any VPS with Docker:
#
#   SITE_ADDRESS=whimlet.example.com docker compose -f engine/compose.yml up -d --build
#
# `web`   = the Next.js standalone server (non-root, healthchecked)
# `caddy` = TLS (auto Let's Encrypt), zstd/brotli/gzip, immutable caching
#
# Without SITE_ADDRESS it serves plain HTTP on port 80 (fine behind Cloudflare
# or another proxy that terminates TLS).

services:
  web:
    build:
      context: ..
      dockerfile: engine/Dockerfile
    image: whimlet:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    expose:
      - "3000"
    # keep the box responsive even if something leaks
    deploy:
      resources:
        limits:
          memory: 512M

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
      - UPSTREAM=web:3000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
