name: CI

# Build verification on GitHub's own infrastructure:
# clean machine → npm ci → design-domain tests → production build (incl. types)
on:
  push:
    branches: [arena/01a0be79-3dwebsite]
  workflow_dispatch: {}

jobs:
  verify:
    name: Install · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci — lockfile-exact)
        run: npm ci

      - name: Design-domain tests
        run: npm run test:design

      - name: Build (includes TypeScript checks)
        run: npm run build
