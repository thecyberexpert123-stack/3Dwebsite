name: CI

# Build verification on GitHub's own infrastructure:
# clean machine → npm ci → design-domain tests → production build (incl. types)
on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  verify:
    name: Install · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci — lockfile-exact)
        run: npm ci

      - name: Domain tests (design + maker)
        run: npm test

      - name: Build — Node deployment (includes TypeScript checks)
        run: npm run build

      - name: Build — static export (GitHub Pages shape)
        run: npm run build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
