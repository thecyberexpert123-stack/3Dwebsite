name: Deploy to GitHub Pages

# Static export of the whole site (home, /studio, /maker, /admin, sitemap,
# robots) served from GitHub Pages at https://<owner>.github.io/3Dwebsite/.
#
# Deploys on every push to `main` and, until the Arena branch is merged, on
# pushes to that branch too (the `github-pages` environment already allows
# it). Remove the arena branch from the list after merging.
#
# If Pages is still set to "Deploy from a branch", the first successful
# run of `actions/deploy-pages` switches the source to GitHub Actions; it
# can also be set by hand under Settings → Pages → Source.
#
# Custom domain / user site? Set NEXT_PUBLIC_BASE_PATH to "" and
# NEXT_PUBLIC_SITE_URL to the domain in the env block below.

on:
  push:
    branches: [main, arena/01a0bf4f-3dwebsite]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Static export
    runs-on: ubuntu-latest
    env:
      NEXT_EXPORT: "1"
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
      # The client falls back to the committed project defaults when these
      # are unset, so they are OPTIONAL. Pass them via Actions secrets to
      # point the public build at your Supabase project at build time (the
      # publishable key is safe to ship). `${!…}` syntax binary-cuts the var
      # when the secret is empty so `?? default` still applies, but the app
      # also treats "" as unset as a second line of defence.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL && format('{0}', secrets.NEXT_PUBLIC_SUPABASE_URL) }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY && format('{0}', secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY) }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci — lockfile-exact)
        run: npm ci

      - name: Domain tests (design + maker)
        run: npm test

      - name: Export static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
